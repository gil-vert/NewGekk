  <meta charset="UTF-8" />

  <title>Style Hub - Clothing Store</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>Style Hub</h1>
    <div class="search-cart">
      <input type="text" placeholder="Search for clothing..." />
      <button>Search</button>
      <button>Cart (0)</button>
    </div>
  </header>

  <main class="product-grid">
    <!-- Sample 6 products shown; repeat and replace as needed up to 30 -->
    <div class="product">
      <img src="https://images.unsplash.com/photo-1541099649105-f69ad21f3246" alt="Men's Jacket">
      <h3>Men's Classic Jacket</h3>
      <p>$120</p>
      <button>Add to Cart</button>
    </div>
    <div class="product">
      <img src="https://images.unsplash.com/photo-1512436991641-6745cdb1723f" alt="Women's Dress">
      <h3>Women's Floral Dress</h3>
      <p>$80</p>
      <button>Add to Cart</button>
    </div>
    <div class="product">
      <img src="https://images.unsplash.com/photo-1520975681731-8bdf4393a1ef" alt="T-Shirt">
      <h3>Unisex Cotton T-Shirt</h3>
      <p>$30</p>
      <button>Add to Cart</button>
    </div>
    <div class="product">
      <img src="https://images.unsplash.com/photo-1593032465171-dc1ab5f1e2e4" alt="Women's Jacket">
      <h3>Women's Casual Jacket</h3>
      <p>$95</p>
      <button>Add to Cart</button>
    </div>
    <div class="product">
      <img src="https://images.unsplash.com/photo-1580236591620-0d5fdc20e3d3" alt="Men's Jeans">
      <h3>Men's Slim Fit Jeans</h3>
      <p>$70</p>
      <button>Add to Cart</button>
    </div>
    <div class="product">
      <img src="https://images.unsplash.com/photo-1618354691477-e1d746c8a82c" alt="Women's Top">
      <h3>Women's Casual Top</h3>
      <p>$40</p>
      <button>Add to Cart</button>
    </div>
    <!-- Add more products similarly -->
  </main>

  <section class="cart-section">
    <h2>Your Cart</h2>
    <p>No items in cart.</p>
    <button class="checkout">Proceed to Checkout</button>
  </section>
